action:
  random_type: 1
architecture:
  common:
    activation_function:
      leaky_relu:
        alpha: 0.01
      type: leaky_relu
    initialization:
      type: he
  proto:
    compression:
      rate:
        dueling: 1.0
        intersection: 0.5
        intersection_encoder: 5.0
        lane: 1.0
        lane_encoder: 5.0
        lanes: 0.5
        road: 1.0
        road_encoder: 5.0
        roads: 0.5
        vehicle_encoder: 5.0
        vehicles: 1.0
      type: linear
    hidden_layers:
      number:
        dueling: 2
        intersection: 1
        intersection_encoder: 2
        lane: 1
        lane_encoder: 2
        lanes: 1
        road: 1
        road_encoder: 2
        roads: 1
        vehicle_encoder: 2
        vehicles: 1
  type: proto
data_augmentation:
  flg: true
duration_steps: 5
framework:
  apex:
    buffer:
      file_capacity: 10000
      priority:
        initial_value: 500
        reset:
          episode:
            interval: 10
          type: target
      size: 200000
    local_agent:
      update_interval: 10
    target_network:
      update_interval: 1000
    td_steps: 1
  type: apex
num_phases: 17
reward:
  common:
    gamma: 0.95
  speedy_vehicles:
    threshold: 0.5
  throughput:
    baseline: 2800
  type: waiting_vehicles
  waiting_vehicles:
    bonus: 1.0
    scaler:
      tanh:
        alpha: 3
      tanh_linear:
        alpha: 3
      type: tanh_linear
    weight:
      exponential:
        half: 50
      type: exponential
simulation_type: test
state:
  intersection:
    phase: true
  lane:
    length: true
    num_vehicles: true
    type: true
  road:
    delay: true
    queue: true
    route: true
  vehicle:
    number: 10
    position: true
    route: true
    speed: true
stop:
  episode: 150
  interval: 100
  type: episode
training:
  batch:
    number: 20
    size: 128
  epoch: 1
  learning_rate: 1e-5
  norm_clip: 1.0
  threshold: 50
  weight_decay: 0.0

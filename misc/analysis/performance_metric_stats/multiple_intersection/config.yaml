target:
  layout:
    9-4-1-c-sh: Straight High
    9-4-1-c-uni: Uniform
  removed_inflow_types: [
    unbalanced_2,
    unbalanced_3,
    unbalanced_4,
  ]
  control_method:
    mpc:
      4-phase: true
      8-phase: true
      17-phase: false
    scoot: true
  performance_metrics: [
    queue_avg,
    queue_max,
    delay_avg_1,
    delay_max,
    speed_avg,
  ]
  seed:
    fix_flg: true
    fix_value: 1
  signal_change_weight: 
    4-phase: 12
    8-phase: 10
    17-phase: 10

simulator:
  num_red_steps: 1            
  simulation_time: 1000
  time_step: 2

mpc: 
  horizon: 5
  min_successive_steps: 4
  num_max_changes: 1
  remained_steps: 2
  utilize_steps: 2
  branch_gap: -3
  objective_function:
    type: waiting_vehicles
    waiting_vehicles:
      definition: 4
      leader_detection:
        type: multiple
      queue_measurement:
        type: ema
        ema:
          alpha: 0.3
      range_type: separate
    signal_change:
      type: global

# scoot:

target:
  layout: '7-4-1'
  control_method:
    mpc:
      4-phase: true
      8-phase: true
      17-phase: false
    scoot: true
  performance_metrics: [
    'queue_avg',
    'queue_max',
    'delay_avg',
    'delay_max',
    'speed_avg',
  ]
  seed:
    fix_flg: true
    fix_value: 1
  delay_type: 1 # 1 or 2
  signal_change_weight: 
    4-phase: 12
    8-phase: 10
    17-phase: 10

figure:
  title:
    queue_avg: 'Average Queue Length Comparison Across All Traffic Scenarios'
    queue_max: 'Maximum Queue Length Comparison Across All Traffic Scenarios'
    delay_avg: 'Average Delay Comparison Across All Traffic Scenarios'
    delay_max: 'Maximum Delay Comparison Across All Traffic Scenarios'
    speed_avg: 'Average Speed Comparison Across All Traffic Scenarios'
  y_axis:
    label: 
      queue_avg: 'Average Queue Length [m]'
      queue_max: 'Maximum Queue Length [m]'
      delay_avg: 'Average Delay [s]'
      delay_max: 'Maximum Delay [s]'
      speed_avg: 'Average Speed [km/h]'

simulator:
  num_red_steps: 1            
  simulation_time: 500
  time_step: 2

mpc: 
  horizon: 5
  min_successive_steps: 4
  num_max_changes: 1
  remained_steps: 2
  utilize_steps: 2
  branch_gap: -3
  objective_function:
    type: waiting_vehicles
    waiting_vehicles:
      definition: 4
      leader_detection:
        type: multiple
      queue_measurement:
        type: ema
        ema:
          alpha: 0.3
      range_type: separate
    signal_change:
      type: global

scoot:
  initial_parameters:          
    cycle: 40                 
    split: [10, 10, 10, 10]    
  change_steps:
    cycle: 1                 
    split: 1                 
  max_cycle: 60                
  min_split: 4                
  spacing_threshold: 20        